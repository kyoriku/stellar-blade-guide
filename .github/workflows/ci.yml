# Fast, deterministic test gate: the backend suite needs no services (it runs
# on aiosqlite + fakeredis by design) and the client job carries lint, unit
# tests, and the type-checking build. The Playwright e2e suite (e2e/) is
# deliberately NOT run here — it needs live Postgres/Redis and real app
# servers; run `npm run e2e` in the dev container before merging.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The uv that writes uv.lock. Pinned with the Dockerfile's COPY --from line and
          # the uv feature in .devcontainer/devcontainer.json; bump all three together.
          version: "0.12.21"
          # sha256 of that version's uv-x86_64-unknown-linux-gnu.tar.gz, from its release's
          # .sha256 asset. It moves with the version: v5 knows no checksum for a uv newer
          # than itself, so without this the download would go unverified.
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
      - run: uv sync --frozen
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Node 22 bundles npm 10, which ignores .npmrc's min-release-age (it needs 11.10+).
      # Pinned with the Dockerfile's client stage and devcontainer.json's postCreateCommand;
      # move all three together (not 12: see devcontainer.json).
      - run: npm install -g npm@11 && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
