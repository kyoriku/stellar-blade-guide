services:
  # Named volumes start root-owned; this chowns them for vscode (UID 1000) before dev starts
  volume-init:
    image: alpine:3.20
    command: >
      sh -c "chown -R 1000:1000 /init/venv /init/node_modules /init/claude && echo 'volume permissions set'"
    volumes:
      - server-venv:/init/venv
      - client-node-modules:/init/node_modules
      - claude-config:/init/claude

  dev:
    # Python 3.14 to match .python-version and prod; image major 3, since major 1 never had a 3.14 build
    image: mcr.microsoft.com/devcontainers/python:3-3.14-bookworm

    volumes:
      - ..:/workspaces/stellar-blade-guide

      # .venv and node_modules live in volumes: Linux builds stay off the Mac and the file share stays fast
      - server-venv:/workspaces/stellar-blade-guide/server/.venv
      - client-node-modules:/workspaces/stellar-blade-guide/client/node_modules

      # Claude Code login and history survive rebuilds
      - claude-config:/home/vscode/.claude

    # init as PID 1 reaps the zombies sleep infinity would leave behind
    init: true
    command: sleep infinity

    # 3000 is open so a phone on the wifi can load the dev site; it reaches the API through
    # Vite's proxy, so 8000 stays local. Both servers must listen on 0.0.0.0
    ports:
      - "3000:3000"
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/stellarblade
      REDIS_URL: redis://redis:6379
      DEBUG: "true"
      # Puts .claude.json in the volume too; without it a rebuild logs you out
      CLAUDE_CONFIG_DIR: /home/vscode/.claude

    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # postgres and redis publish no ports: dev reaches them over the compose network,
  # and the Mac's own Postgres and Redis already hold 5432 and 6379
  postgres:
    # Debian, like Railway's: Alpine's Postgres sorts text differently, so ORDER BY wouldn't match prod
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellarblade
    volumes:
      # Named for the major: a data directory only starts under the major that created it
      - postgres17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stellarblade"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Railway's exact minor: newer minors add commands prod wouldn't accept
    image: redis:8.4
    restart: unless-stopped
    volumes:
      # Named for the major: an older Redis can refuse data saved by a newer one
      - redis8-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres17-data:
  redis8-data:
  server-venv:
  client-node-modules:
  claude-config: